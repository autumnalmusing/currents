[package]
name = "currents"
version = "0.1.0"
edition = "2021"
authors = ["autumn"]
description = "A daemon for sending weather pattern alerts via system notifications"
license-file = "LICENSE"

[[bin]]
name = "currents"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.47.1", features = ["full"] }
reqwest = { version = "0.12.23", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
notify-rust = "4.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
tabled = { version = "0.17", features = ["ansi"] }

[dev-dependencies]
tempfile = "3.14"

[workspace.metadata.marker.lints]
marker_lints = "0.4.3"
