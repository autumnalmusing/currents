[workspace]
resolver = "2"
members = [
    "currents-core",
    "currents-daemon",
    "currents-forecast",
    "currents-history",
    "currents-storage",
    "currents-orchestrator",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["autumn"]
license-file = "LICENSE"
repository = "https://github.com/autumnalmusing/currents"

[workspace.dependencies]
# Shared dependencies with latest versions across workspace
tokio = { version = "1.47.1", features = ["full"] }
reqwest = { version = "0.12.24", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Daemon-specific
notify-rust = "4.11"
clap = { version = "4.5", features = ["derive"] }

# Forecast-specific  
tabled = { version = "0.17", features = ["ansi"] }

# Dev dependencies
tempfile = "3.14"

# Utility crates
dirs = "6.0"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Visualization
ratatui = "0.28"
crossterm = "0.28"

# Math and statistics
statrs = "0.16"

# Additional dependencies for consistency
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1"
shellexpand = "3.0"
futures = "0.3"

# Inter-workspace dependencies
currents-core = { path = "currents-core" }
currents-history = { path = "currents-history" }
currents-storage = { path = "currents-storage" }

# All dependencies are managed through workspace.dependencies above