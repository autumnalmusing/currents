[package]
name = "currents-orchestrator"
version = "0.1.0"
edition = "2021"
authors = ["Currents Contributors"]
description = "Multi-location weather monitoring orchestrator"
license = "Peer Production License"

[dependencies]
currents-core = { path = "../currents-core" }
currents-storage = { path = "../currents-storage" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
shellexpand = "3.0"