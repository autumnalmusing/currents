[package]
name = "currents-orchestrator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
description = "Multi-location weather monitoring orchestrator"

[[bin]]
name = "simple-collector"
path = "src/bin/simple-collector.rs"

[[bin]]
name = "multi-collector"
path = "src/bin/multi-collector.rs"

[dependencies]
currents-core = { workspace = true }
currents-storage = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1"
shellexpand = "3.0"