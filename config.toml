# Currents Configuration
# This is an example configuration file in TOML format

[weather]
api_key = "your-openweathermap-api-key-here"
location = "London,UK"
units = "metric"
provider = "openweathermap"
# Maximum API calls per day (default: 1000, increase if you're willing to pay for more)
# Free tiers typically allow 1000 calls/day before charges apply
api_daily_limit = 1000

[notifications]
urgency = "normal"
timeout = 5000
sound = true

[polling]
interval_seconds = 300
retry_attempts = 3
retry_delay_seconds = 60

[[alerts]]
name = "hot-weather"
enabled = true
message = "It's getting hot! Temperature is above 30°C"
# repeat = "once"  (default) - Only notify on first trigger, not again until conditions return to normal
repeat = "once"
[alerts.condition.temperature]
min = 30.0

[[alerts]]
name = "cold-weather"
enabled = true
message = "Brrr! It's getting cold, temperature below 5°C"
# repeat = "3600"  - Notify every hour (3600 seconds) while condition persists
repeat = "3600"
[alerts.condition.temperature]
max = 5.0

[[alerts]]
name = "stormy-weather"
enabled = true
message = "Stormy weather detected! Stay safe."
# repeat = "once" (default)
[alerts.condition]
description = "storm,thunder,lightning"

[[alerts]]
name = "rain-alert"
enabled = true
message = "Rain detected - don't forget your umbrella!"
# repeat = "always" - Notify every polling interval while raining (use sparingly!)
repeat = "always"
[alerts.condition]
description = "rain,drizzle,shower"
